name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm audit --audit-level=moderate

      - run: npm test

      - run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: pbiviz-package
          path: dist/*.pbiviz
          if-no-files-found: error
